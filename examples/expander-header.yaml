# Erstatning for expander-headerne i #stue-popupen.
# Bytt kun ut det høyre "teller"-kortet (grid-area: three) i hver title-card.
# Samme mønster for kjokken, bad, gang, pult, soverom osv. – bare bytt sensor-navnet.

# ---- Lys ----------------------------------------------------------------
- type: custom:button-card
  view_layout:
    grid-area: three
  entity: sensor.stue_lys
  name: '[[[ return entity.attributes.tekst ]]]'
  show_icon: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - padding: 8px 0px
      - overflow: visible
      - --mdc-ripple-press-opacity: 0
    name:
      - color: var(--gray600)
      - font-size: 14px
      - font-weight: 500
      - justify-self: end
      - align-self: end

